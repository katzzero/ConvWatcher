name: Build and Push Docker Image

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_GHCR: ghcr.io

jobs:
  audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      checks: write
    # cargo-audit's current release needs a newer rustc than the 1.95 pinned
    # for the build; use stable only for the audit tooling.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      # actions/checkout@v4 -> 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # rustsec/audit-check@v2 -> 69366f33c96575abad1ee0dba8212993eecbe998 (branch v2, sem tag v2 publicada)
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      # actions/checkout@v4 -> 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Install ffmpeg for e2e
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build binary for e2e
        run: cargo build
      - name: Run test suite
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
        run: cargo test
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # actions/checkout@v4 -> 11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # docker/setup-qemu-action@v3 -> c7c53464625b32c7a7e944ae62b3e17d2b600130
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      # docker/setup-buildx-action@v3 -> 8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # docker/login-action@v3 -> c94ce9fb468520275223c153574b00df6fe4bcc9
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/login-action@v3 -> c94ce9fb468520275223c153574b00df6fe4bcc9
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # docker/metadata-action@v5 -> c299e40c65443455700f0fdfc63efafe5b349051
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/convwatcher
            ${{ github.repository_owner }}/convwatcher
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # docker/build-push-action@v6 -> 10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=convwatcher
          cache-to: type=gha,mode=max,scope=convwatcher
  docker-smoke:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      # actions/checkout@v4 -> 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # docker/login-action@v3 -> c94ce9fb468520275223c153574b00df6fe4bcc9
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull released image
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          docker pull "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/convwatcher:${TAG}"
      - name: Run container smoke test
        env:
          SMOKE_PORT: "18080"
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ./scripts/docker-smoke.sh "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/convwatcher:${TAG}"
